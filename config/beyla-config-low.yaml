# Low-traffic profile: conservative sampling, small buffers.
# Use for canary, dev, or quiet stage clusters (< 100 RPS / service).

log_level: info
open_port: 8080

discovery:
  services:
    - k8s_namespace: [demo]

otel_traces_export:
  sampler:
    name: parentbased_traceidratio
    arg: 0.01                   # 1% traces
  batch:
    timeout: 10s
    max_export_batch_size: 256

profiles:
  sampling_rate_hz: 7           # rare profiles

rate_limit:
  cpu_high_watermark: 50
  memory_high_watermark: 60
  drop_traces_first: true

metrics:
  max_series_per_service: 10000
  max_labels_per_series: 8
