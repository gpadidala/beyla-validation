{{- if .Values.rbac.create }}
# Minimum RBAC for Beyla:
#  - read-only access to pods/nodes/services for K8s metadata enrichment
#  - no write access anywhere
#  - no access to secrets, configmaps in other namespaces, or RBAC objects
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "beyla.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, nodes, services, namespaces, replicationcontrollers]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "beyla.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
