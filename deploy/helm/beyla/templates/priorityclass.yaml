{{- if .Values.priorityClass.create }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.daemonset.priorityClassName }}
  labels: {{- include "beyla.labels" . | nindent 4 }}
value: {{ .Values.priorityClass.value }}
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Beyla DaemonSet — high priority so observability isn't evicted first under pressure"
{{- end }}
