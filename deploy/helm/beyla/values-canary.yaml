# Canary overrides: 1% of nodes, single namespace, conservative sampling.
# Goal: gather signal cheaply without risk.

global:
  stack: canary
  targetNamespaces: [demo]
  failClosedOnEndpointUnreachable: false

beyla:
  profile: low
  traces:
    samplingRatio: 0.01          # 1% during canary
  profiles:
    cpuSamplingHz: 7             # very low frequency
  discovery:
    podLabelSelector: "beyla.grafana.com/canary=true"

resources:
  requests: { cpu: 50m,  memory: 150Mi }
  limits:   { cpu: 250m, memory: 400Mi }

daemonset:
  # Restrict canary to 1% of nodes via node label set by the rollout script.
  nodeSelector:
    beyla.grafana.com/canary: "true"

# Tighter cardinality budget during canary.
cardinality:
  maxSeriesPerService: 10000
  maxLabelsPerSeries: 8
