apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: beyla-core
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/component: beyla
spec:
  groups:
    - name: beyla.core
      interval: 30s
      rules:
        # ── Beyla / Alloy DaemonSet coverage ────────────────────────────
        - alert: BeylaDaemonSetDegraded
          expr: |
            (
              kube_daemonset_status_number_ready{daemonset=~"beyla|alloy"}
              / kube_daemonset_status_desired_number_scheduled{daemonset=~"beyla|alloy"}
            ) < 0.95
          for: 5m
          labels: { severity: critical, team: platform }
          annotations:
            summary: "{{ $labels.daemonset }} has unready pods on > 5% of nodes"
            description: "{{ $value | humanizePercentage }} ready in {{ $labels.cluster }}. Investigate node health and eBPF attach failures."
            runbook: https://github.com/gpadidala/beyla-validation/blob/main/runbooks/02-incident-high-cpu.md

        # ── eBPF / instrumentation failures ─────────────────────────────
        # Real metric: beyla_instrumentation_errors_total (replaces the
        # non-existent beyla_ebpf_program_load_failures_total).
        - alert: BeylaInstrumentationErrors
          expr: sum(rate(beyla_instrumentation_errors_total[5m])) > 0
          for: 5m
          labels: { severity: critical, team: platform }
          annotations:
            summary: "Beyla failing to instrument processes ({{ $value }}/sec)"
            description: "uprobe/kprobe attach errors. Likely kernel/BTF mismatch or missing symbols."
            runbook: https://github.com/gpadidala/beyla-validation/blob/main/compatibility/matrix.md

        # ── Beyla absent ─────────────────────────────────────────────────
        - alert: BeylaNoProcessesInstrumented
          expr: sum(beyla_instrumented_processes) == 0
          for: 10m
          labels: { severity: critical, team: platform }
          annotations:
            summary: "Beyla is running but instrumenting zero processes"
            description: "Check discovery.pod_label_selector and exclude_namespaces. Beyla may not be seeing any opted-in pods."

        # ── OTel export errors ─────────────────────────────────────────
        - alert: BeylaTraceExportErrors
          expr: |
            sum(rate(beyla_otel_trace_export_errors_total[5m]))
              / clamp_min(sum(rate(beyla_otel_trace_exports_total[5m])), 1) > 0.05
          for: 5m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "> 5% of trace exports failing"
            description: "{{ $value | humanizePercentage }} error rate. Check Tempo/Alloy connectivity."

        - alert: BeylaMetricExportErrors
          expr: |
            sum(rate(beyla_otel_metric_export_errors_total[5m]))
              / clamp_min(sum(rate(beyla_otel_metric_exports_total[5m])), 1) > 0.05
          for: 5m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "> 5% of metric exports failing"
            description: "{{ $value | humanizePercentage }} error rate. Check Prometheus remote_write target."

        # ── eBPF backpressure (proxy via flush histogram) ──────────────
        - alert: BeylaFlushLatencyHigh
          expr: histogram_quantile(0.99, sum by (le) (rate(beyla_ebpf_tracer_flushes_bucket[5m]))) > 1
          for: 10m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "eBPF ringbuf flush P99 > 1s"
            description: "Beyla can't drain ringbuf fast enough — events may be lost. Reduce sampling or scale Beyla CPU."

        # ── Beyla CPU throttle (cgroup level) ──────────────────────────
        - alert: BeylaCPUThrottling
          expr: |
            sum(rate(container_cpu_cfs_throttled_periods_total{pod=~"beyla-.*|alloy-.*"}[5m]))
              / sum(rate(container_cpu_cfs_periods_total{pod=~"beyla-.*|alloy-.*"}[5m])) > 0.05
          for: 10m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "Beyla / Alloy pods CPU-throttled > 5%"
            description: "Throttling = {{ $value | humanizePercentage }}. Raise limits or drop trace sampling."
