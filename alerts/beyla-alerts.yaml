apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: beyla-core
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/component: beyla
spec:
  groups:
    - name: beyla.core
      interval: 30s
      rules:
        - alert: BeylaDaemonSetDegraded
          expr: |
            kube_daemonset_status_number_ready{daemonset="beyla"}
              / kube_daemonset_status_desired_number_scheduled{daemonset="beyla"} < 0.95
          for: 5m
          labels: { severity: critical, team: platform }
          annotations:
            summary: "Beyla DaemonSet has unready pods on > 5% of nodes"
            description: "{{ $value | humanizePercentage }} of beyla pods ready in {{ $labels.cluster }}. Investigate node health and eBPF attach failures."
            runbook: https://runbooks.example.com/beyla/daemonset-degraded

        - alert: BeylaProbeLoadFailures
          expr: sum(rate(beyla_ebpf_program_load_failures_total[5m])) > 0
          for: 2m
          labels: { severity: critical, team: platform }
          annotations:
            summary: "Beyla eBPF program load failures"
            description: "{{ $value }} load failures/sec. Likely kernel/BTF mismatch."
            runbook: https://runbooks.example.com/beyla/probe-load-failures

        - alert: BeylaCPUThrottling
          expr: |
            sum(rate(container_cpu_cfs_throttled_periods_total{pod=~"beyla-.*"}[5m]))
              / sum(rate(container_cpu_cfs_periods_total{pod=~"beyla-.*"}[5m])) > 0.05
          for: 10m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "Beyla pods CPU-throttled > 5%"
            description: "Throttling = {{ $value | humanizePercentage }}. Raise limits or drop sampling."

        - alert: BeylaExportQueueSaturated
          expr: max(beyla_export_queue_size / beyla_export_queue_capacity) > 0.8
          for: 5m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "Beyla export queue > 80% full"
            description: "Backpressure imminent. Check Tempo / Pyroscope ingest health."

        - alert: BeylaTraceDropsHigh
          expr: |
            sum(rate(beyla_otel_traces_dropped_total[5m]))
              / clamp_min(sum(rate(beyla_otel_traces_total[5m])), 1) > 0.1
          for: 5m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "> 10% of traces being dropped by Beyla"
            description: "Drop rate = {{ $value | humanizePercentage }}."
