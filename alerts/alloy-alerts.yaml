apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alloy-pipeline
  namespace: monitoring
  labels: { release: kube-prometheus-stack }
spec:
  groups:
    - name: alloy.pipeline
      interval: 30s
      rules:
        - alert: AlloyDaemonSetDegraded
          expr: |
            kube_daemonset_status_number_ready{daemonset="alloy"}
              / kube_daemonset_status_desired_number_scheduled{daemonset="alloy"} < 0.95
          for: 5m
          labels: { severity: critical, team: platform }
          annotations:
            summary: "Alloy DaemonSet < 95% ready"
            description: "Beyla telemetry coverage degraded on > 5% of nodes."

        - alert: AlloyConfigReloadFailed
          expr: alloy_config_last_load_success_timestamp_seconds == 0
          for: 5m
          labels: { severity: critical, team: platform }
          annotations:
            summary: "Alloy on {{ $labels.instance }} failed to load config"
            description: "Check `kubectl logs ds/alloy -n alloy` for the parse error."

        - alert: AlloyExporterFailures
          expr: |
            sum by (exporter) (rate(otelcol_exporter_send_failed_metric_points_total[5m]))
              + sum by (exporter) (rate(otelcol_exporter_send_failed_spans_total[5m])) > 1
          for: 5m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "Alloy exporter {{ $labels.exporter }} dropping data"

        - alert: AlloyComponentUnhealthy
          expr: |
            sum(alloy_component_controller_running_components{health_type!="healthy"}) > 0
          for: 5m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "Alloy has {{ $value }} unhealthy components"
            description: "Open the Alloy live debug UI at :12345 for the component graph."

        - alert: BeylaComponentNotLoaded
          expr: absent(beyla_build_info) == 1
          for: 5m
          labels: { severity: critical, team: platform }
          annotations:
            summary: "Beyla component not loaded inside Alloy"
            description: "beyla.ebpf is missing — kernel/BTF mismatch or experimental stability not enabled."
