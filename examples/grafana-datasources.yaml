apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - { name: traceID, datasourceUid: tempo }
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:    { datasourceUid: loki, spanStartTimeShift: -2m, spanEndTimeShift: 2m }
      tracesToMetrics:   { datasourceUid: prometheus }
      tracesToProfiles:  { datasourceUid: pyroscope, profileTypeId: process_cpu:cpu:nanoseconds:cpu:nanoseconds }
      serviceMap:        { datasourceUid: prometheus }
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
  - name: Pyroscope
    type: grafana-pyroscope-datasource
    uid: pyroscope
    access: proxy
    url: http://pyroscope:4040
