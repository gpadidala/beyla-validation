events {}
http {
  access_log /dev/stdout;
  error_log  /dev/stderr;

  server {
    listen 80;
    location = /                  { return 200 "ok\n"; }
    location = /healthz           { return 200 "ok\n"; }
    location  /api/users/         { return 200 '{"id":1,"name":"alice"}\n'; default_type application/json; }
    location  /api/products       { return 200 '[{"sku":"a1"},{"sku":"b2"}]\n'; default_type application/json; }
    location  /api/orders/        { return 200 '{"order":42,"total":99}\n'; default_type application/json; }
    location  /api/will-500       { return 500 "forced error\n"; }
    location /                    { return 404 "not found\n"; }
  }
}
