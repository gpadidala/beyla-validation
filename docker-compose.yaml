# Local dev stack: Alloy (with Beyla embedded) → LGTM, plus a demo nginx
# app and a k6 traffic generator so dashboards always have data.
#
# Note: macOS Docker Desktop runs containers inside a Linux VM. Beyla's
# eBPF programs attach inside the VM, not to your Mac. Demo app traffic
# from k6 IS visible to Beyla because both run in the same VM kernel.
# Native eBPF features (kprobe, fentry) work; some perf-event paths may
# not on Docker Desktop's stripped kernel.
#
# Usage:
#   make dev-up
#   make e2e
#   make dev-down

services:
  alloy:
    image: grafana/alloy:v1.4.2
    privileged: true
    init: true                  # reap eBPF child processes cleanly on restart
    # pid: host gives Alloy/Beyla visibility into the Docker Desktop Linux
    # VM's PID namespace — which includes every other container's
    # processes. Without this, Beyla only sees its own process and emits
    # zero application metrics.
    # We keep BRIDGE networking (no `network_mode: host`) so port 12345
    # remains reachable from the Mac. In production (K8s DaemonSet) we
    # use both hostPID AND hostNetwork — see alloy/values.yaml.
    pid: host
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=experimental         # beyla.ebpf requires this
    volumes:
      - ./examples/alloy-config-local.alloy:/etc/alloy/config.alloy:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    ports: ["12345:12345"]
    depends_on: [prometheus, tempo, pyroscope]

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=native-histograms,exemplar-storage
    volumes:
      - ./examples/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./examples/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports: ["13200:3200", "14317:4317", "14318:4318"]

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./examples/loki.yaml:/etc/loki/loki.yaml:ro
    ports: ["3100:3100"]

  pyroscope:
    image: grafana/pyroscope:1.9.2
    command: ["server"]
    volumes:
      - ./examples/pyroscope.yaml:/etc/pyroscope/server.yaml:ro
    ports: ["4040:4040"]

  grafana:
    image: grafana/grafana:12.4.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor,flameGraph,exemplars,tempoApmTable
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./examples/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./examples/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo, loki, pyroscope]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./examples/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8081:80"]

  k6:
    image: grafana/k6:0.54.0
    volumes:
      - ./examples/k6-load.js:/load.js:ro
    command: ["run", "/load.js"]
    depends_on: [nginx]
