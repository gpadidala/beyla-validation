# Podman-specific overrides. Auto-merged when ENGINE=podman.
#
# Differences vs Docker:
#  - SELinux-labelled bind mounts need `:Z` on Fedora / RHEL hosts (the
#    default `podman machine` VM on macOS runs Fedora CoreOS). On systems
#    without SELinux the label is silently ignored.
#  - `userns_mode: keep-id` keeps file ownership sane when running rootless.
#  - eBPF requires rootful Podman OR `--security-opt label=disable` plus
#    a privileged container. We already declare privileged: true on Alloy.
#
# Apply: `podman compose -f docker-compose.yaml -f docker-compose.podman.yaml up -d`
# Or via Makefile: `make dev-up ENGINE=podman`

services:
  alloy:
    security_opt:
      - label=disable        # /sys/fs/bpf access on SELinux-enforcing hosts
    volumes:
      - ./examples/alloy-config-local.alloy:/etc/alloy/config.alloy:ro,Z
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

  prometheus:
    volumes:
      - ./examples/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z

  tempo:
    volumes:
      - ./examples/tempo.yaml:/etc/tempo/tempo.yaml:ro,Z

  loki:
    volumes:
      - ./examples/loki.yaml:/etc/loki/loki.yaml:ro,Z

  pyroscope:
    volumes:
      - ./examples/pyroscope.yaml:/etc/pyroscope/server.yaml:ro,Z

  grafana:
    volumes:
      - ./examples/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro,Z
      - ./dashboards:/var/lib/grafana/dashboards:ro,Z
      - ./examples/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro,Z

  nginx:
    volumes:
      - ./examples/nginx.conf:/etc/nginx/nginx.conf:ro,Z

  k6:
    volumes:
      - ./examples/k6-load.js:/load.js:ro,Z
