name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push (digest-pinned)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/beyla:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/beyla:latest
          provenance: true
          sbom: true
      - name: Output digest for ops to pin
        run: echo "DIGEST=${{ steps.build.outputs.digest }}"
